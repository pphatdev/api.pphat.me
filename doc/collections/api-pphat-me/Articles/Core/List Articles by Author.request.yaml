$kind: http-request
description: Returns all articles (including drafts) for the given author ID. The requesting user must own this author profile or be an admin.
url: "{{baseUrl}}/v1/api/articles/author/{{authorId}}?page=1&limit=10"
method: GET
headers:
  - key: Authorization
    value: Bearer {{token}}
    description: JWT token — must be the author's linked user or an admin
queryParams:
  - key: page
    value: "1"
    description: "Page number (default: 1)"
  - key: limit
    value: "10"
    description: "Items per page (default: 10, max: 100)"
  - key: search
    value: ""
    disabled: true
    description: Search in title, slug, description
  - key: sort
    value: title,created_at
    disabled: true
    description: "Comma-separated sort columns: id, title, slug, description, published, created_at, updated_at"
  - key: order
    value: desc
    disabled: true
    description: "Sort direction applied to all sort columns: asc, desc"
order: 2000

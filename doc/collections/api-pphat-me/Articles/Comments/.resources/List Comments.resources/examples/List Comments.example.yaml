$kind: http-example
request:
  url: "{{baseUrl}}/v1/api/articles/{{slug}}/comments?page=1&limit=10"
  method: GET
  queryParams:
    - key: page
      value: "1"
      description: "Page number (default: 1)"
    - key: limit
      value: "10"
      description: "Items per page (default: 10, max: 100)"
response:
  statusCode: 200
  statusText: OK
  headers:
    Transfer-Encoding: chunked
    Content-Type: application/json
    Content-Encoding: gzip
    X-RateLimit-Limit: "300"
    X-RateLimit-Remaining: "299"
    X-RateLimit-Reset: "60"
  body:
    type: text
    content: |-
      {
          "data": [
              {
                  "id": 1,
                  "articleId": "c67640b9-dd5c-44a9-93de-4efd8cded2a8",
                  "authorName": "John Doe",
                  "content": "Great article!",
                  "createdAt": "2026-04-27T03:52:57.288Z",
                  "updatedAt": "2026-04-27T03:52:57.288Z"
              }
          ],
          "pagination": {
              "page": 1,
              "limit": 10,
              "total": 1,
              "totalPages": 1
          }
      }
order: 1000

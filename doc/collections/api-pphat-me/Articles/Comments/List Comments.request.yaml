$kind: http-request
url: "{{baseUrl}}/v1/api/articles/{{slug}}/comments?page=1&limit=10"
method: GET
queryParams:
  - key: page
    value: "1"
    description: "Page number (default: 1)"
  - key: limit
    value: "10"
    description: "Items per page (default: 10, max: 100)"
examples: ./.resources/List Comments.resources/examples
order: 1000

$kind: http-request
description: |-
  Create an experience timeline entry. Admin only.

  **Required:** title, company, start_date.
  **Optional:** description, end_date (null = current role), location, employment_type (full-time | part-time | contract | internship | freelance, default full-time), company_url, logo_url, cover (nullable), status (0 inactive, 1 active — default 1).

  CamelCase aliases accepted for: startDate, endDate, employmentType, companyUrl, logoUrl.
url: "{{baseUrl}}/v1/api/experiences"
method: POST
headers:
  - key: Authorization
    value: Bearer {{token}}
    description: Admin JWT required
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "title": "Senior Software Engineer",
        "company": "Acme Co",
        "description": "Led the platform team.",
        "start_date": "2023-01-01",
        "end_date": null,
        "location": "Remote",
        "employment_type": "full-time",
        "company_url": "https://acme.example",
        "logo_url": "https://acme.example/logo.png",
        "cover": "https://acme.example/cover.png",
        "status": 1
    }
examples: ./.resources/Create Experience.resources/examples
order: 3000

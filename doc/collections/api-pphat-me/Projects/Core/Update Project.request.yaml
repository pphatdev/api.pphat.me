$kind: http-request
url: "{{baseUrl}}/v1/api/projects/{{projectSlug}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated Project Title",
      "description": "Updated description.",
      "published": true,
      "tag_ids": [1],
      "contributor_ids": [1],
      "languages": ["TypeScript", "SQL"],
      "content": "Updated project content.",
      "demoUrl": "https://updated-demo.example.com",
      "repoUrl": "https://github.com/example/updated-project",
      "techStack": ["TypeScript", "Cloudflare Workers"],
      "status": "completed"
    }
order: 4000

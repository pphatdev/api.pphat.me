$kind: http-request
description: Partial update of an FAQ. Admin only. Accepts any subset of create fields.
url: "{{baseUrl}}/v1/api/faqs/{{faqId}}"
method: PATCH
headers:
  - key: Authorization
    value: Bearer {{token}}
    description: Admin JWT required
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "category": "Overview",
        "sort_order": 2
    }
order: 5000

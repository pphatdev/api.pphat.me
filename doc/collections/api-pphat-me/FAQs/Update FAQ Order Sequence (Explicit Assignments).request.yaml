$kind: http-request
description: Update FAQ order sequence with explicit sequence index numbers. Admin only.
url: "{{baseUrl}}/v1/api/faqs/order-sequence"
method: PATCH
headers:
  - key: Authorization
    value: Bearer {{token}}
    description: Admin JWT required
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "sequence": [
        {
          "id": 1,
          "sequence": 0
        }
      ]
    }
order: 9000

$kind: http-request
description: List tech stacks. Requires auth.
url: "{{baseUrl}}/v1/api/tech-stacks?page=1&limit=10"
method: GET
headers:
  - key: Authorization
    value: Bearer {{token}}
    description: JWT access token or an SSO API key via `ApiKey {{apiKey}}`
queryParams:
  - key: page
    value: "1"
    description: "Page number (default: 1)"
  - key: limit
    value: "10"
    description: "Items per page (default: 10, max: 100)"
  - key: search
    value: ""
    disabled: true
    description: Search in name, description
  - key: sort
    value: id
    disabled: true
    description: "Sort column: id, name, status, created_at, updated_at"
  - key: order
    value: asc
    disabled: true
    description: "Sort order: asc, desc"
order: 1000

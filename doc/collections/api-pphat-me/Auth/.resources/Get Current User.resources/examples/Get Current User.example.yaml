  statusCode: 200
  statusText: OK
  headers:
    Transfer-Encoding: chunked
    Content-Type: application/json
    Content-Encoding: gzip
    X-RateLimit-Limit: "20"
    X-RateLimit-Remaining: "19"
    X-RateLimit-Reset: "60"

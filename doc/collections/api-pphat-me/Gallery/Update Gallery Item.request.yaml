$kind: http-request
description: Update an existing gallery item. Admin only.
url: "{{baseUrl}}/v1/api/gallery/{{galleryId}}"
method: PUT
headers:
  - key: Authorization
    value: Bearer {{token}}
    description: Admin JWT required
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated Title",
      "caption": "Updated descriptive caption",
      "isPublic": true,
      "isFeatured": true,
      "aspectRatio": "16/9"
    }
order: 7000

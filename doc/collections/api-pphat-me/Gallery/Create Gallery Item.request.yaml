$kind: http-request
description: |-
  Create a new gallery item or bulk items array. Admin only.

  **Required:** `title`, `mediaPath` (or `media_path`).
  **Optional:** `caption`, `altText` (`alt_text`), `category` (default: 'photography'), `tags` (array of strings), `isPublic` (`is_public`, boolean or 0/1, default: true), `isFeatured` (`is_featured`, boolean or 0/1, default: false), `sortOrder` (`sort_order`, integer), `aspectRatio` (`aspect_ratio`: '16/9', '4/3', '1/1', '3/4', '9/16', 'auto').
url: "{{baseUrl}}/v1/api/gallery"
method: POST
headers:
  - key: Authorization
    value: Bearer {{token}}
    description: Admin JWT required
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Phnom Penh Riverside Twilight",
      "caption": "Evening reflections over the Tonle Sap and Mekong river convergence.",
      "altText": "Phnom Penh riverside evening view",
      "mediaPath": "blogs/media/riverside-twilight.webp",
      "category": "photography",
      "tags": ["cambodia", "riverside", "twilight"],
      "isPublic": true,
      "isFeatured": true,
      "sortOrder": 1,
      "aspectRatio": "16/9"
    }
order: 6000
